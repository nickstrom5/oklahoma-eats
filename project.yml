name: OklahomaEats
options:
  bundleIdPrefix: com.oklahomaeats
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "4C8TU6U7MQ"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  OklahomaEats:
    type: application
    platform: iOS
    sources:
      - path: OklahomaEats
    info:
      path: OklahomaEats/Info.plist
      properties:
        CFBundleDisplayName: Oklahoma Eats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIUserInterfaceStyle: Light      # the palette is light-only (Design/Theme.swift); dark mode made lists unreadable
        NSLocationWhenInUseUsageDescription: "Your location sorts restaurants, cafés and oyster bars by distance and shows where you are on the map. It stays on your device."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [maps]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oklahomaeats.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [OklahomaEatsTests, OklahomaEatsUITests]

  OklahomaEatsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OklahomaEatsTests
    dependencies:
      - target: OklahomaEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oklahomaeats.ios.tests
        GENERATE_INFOPLIST_FILE: true

  OklahomaEatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OklahomaEatsUITests
    dependencies:
      - target: OklahomaEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oklahomaeats.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: OklahomaEats
